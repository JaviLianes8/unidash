[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unidash"
version = "1.0.0"
description = "Fold Unicode dashes and punctuation to plain ASCII while leaving letters untouched"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = [
    "unicode", "ascii", "punctuation", "dash", "hyphen", "en-dash", "em-dash", "minus",
    "soft-hyphen", "quotes", "normalize", "text",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Filters",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
unidash = "unidash._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-timeout", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/unidash"
Issues = "https://github.com/JaviLianes8/unidash/issues"
Changelog = "https://github.com/JaviLianes8/unidash/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.sdist]
# Third-party data files are fetched locally and never shipped; only their manifest is.
exclude = [
    "IMPROVEMENTS-round*.md",
    "CERT-1.0-*.md",
    "tests/vectors/unicode/*",
    "!tests/vectors/unicode/MANIFEST.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["src/unidash"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
addopts = "-q --doctest-modules"
timeout = 300
